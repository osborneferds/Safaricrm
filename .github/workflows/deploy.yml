# Deploys DuneSuite to GitHub Pages on every push to main/master.
#
# IMPORTANT: the build runs with `--base=./` so all asset URLs are
# site-relative. Without this flag Vite emits absolute /assets/... paths,
# which 404 when the site lives at https://<user>.github.io/<repo>/ and the
# page renders blank. The CLI flag overrides the config, so no edits to
# vite.config.js are required.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build (site-relative base for GitHub Pages)
        run: npx vite build --base=./

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
